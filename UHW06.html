<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGCMI</title>
    <link rel="stylesheet" href="CitasPaciente.css">
    <link rel="icon" href="icono.png" type="image/png">
</head>

<body>

    <!--Header section-->
    <header class="header">
        <img class="logo" src="logo.png" alt="logo"><!--Logo-->
        <div class="user"></div><!--Recolectar info del usuario-->
        <button class="logout"><a href="index.html">Cerrar Sesión</a></button><!--Cerrar la sesion del usuario-->
    </header>

    <!--Main container-->
    <main class="container">

        <!--Cards section-->
        <section class="cards">
            <div class="card">
                <h3>Próximas citas</h3>
                <p class="number" id="numCitas">0</p><!--Sacar la cantidad te citas que tiene proximamente-->
                <p class="desc">Citas programadas</p>
            </div>
            <div class="card">
                <h3>Consultas realizadas</h3>
                <p class="number" id="numConsultas">0</p><!--Sacar la cantidad te citas que tiene proximamente-->
                <p class="desc">Total de consultas</p>
            </div>
            <div class="card">
                <h3>Historial médico</h3>
                <p class="number" id="numHistorial">0</p><!--Sacar la cantidad te citas que tiene proximamente-->
                <p class="desc">Registros guardados</p>
            </div>
        </section>

        <!--Agenda section-->
        <section class="agenda">
            <!--First appointment-->
            <div class="appointment">
                <div class="info"></div>
                <div class="actions">
                    <button class="btn">Reprogramar cita</button>
                    <button class="btn">Cancelar cita</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
