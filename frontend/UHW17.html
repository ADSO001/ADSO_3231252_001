<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas</title>
    <link rel="stylesheet" href="css/UHW17.css">
</head>
<body>
<div class="contenedor-principal">
        <aside class="barra-lateral">
            <div class="logo-contenedor">
                <div class="espacio-imagen-logo"><img class="espacio-imagen-logo"src="img/logo.png" alt="logo"></div>
                <h1>SIGCMI</h1>
            </div>

            <nav class="navegacion">
                <a href="#" class="enlace-nav activo">
                    <span class="espacio-icono"><img class="espacio-icono" src="img/barras.svg"></span> Panel principal
                </a>
                <a href="#" class="enlace-nav">
                    <span class="espacio-icono"><img class="espacio-icono" src="img/calendar.svg"></span> Agenda de citas
                </a>
                <a href="#" class="enlace-nav">
                    <span class="espacio-icono"><img class="espacio-icono" src="img/personas.svg"></span> Pacientes
                </a>
                <a href="#" class="enlace-nav">
                    <span class="espacio-icono"><img class="espacio-icono" src="img/libro.svg"></span> Médicos
                </a>
                <a href="#" class="enlace-nav">
                    <span class="espacio-icono"><img class="espacio-icono" src="img/verificarmedicos.svg"></span> Verificar Médicos
                </a>
                <a href="#" class="enlace-nav">
                    <span class="espacio-icono"><img class="espacio-icono" src="img/reloj.svg"></span> Horarios
                </a>
            </nav>

            <div class="pie-lateral">
                <button class="boton-cerrar-sesion">
                     Cerrar sesión
                </button>
                <div class="perfil-usuario">
                    <div class="espacio-imagen-perfil"><img class="espacio-icono" id="perfil "src="img/perfil.svg"></div>
                    <div class="textos-perfil">
                        <span class="nombre-perfil">Admin</span>
                        <span class="rol-perfil">Administrador</span>
                    </div>
                </div>
            </div>
        </aside>
        <div class="barra-filtros">
                <div class="caja-buscar">
                    <span class="caja-ico"><img src="img/lupa.svg" class="img-ico"></span>
                    <input type="text" placeholder="Buscar por paciente, médico o motivo..." class="input-buscar">
                </div>
                
                <select class="select-estado">
                    <option>Todos los estados</option>
                    <option>Programadas</option>
                    <option>Confirmadas</option>
                    <option>Completadas</option>
                    <option>Canceladas</option>
                    <option>No asistió</option>
                </select>
                
            </div>

</body>
</html>
