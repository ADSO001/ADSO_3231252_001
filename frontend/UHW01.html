<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta Paciente - SIGCMI</title>
    <link rel="stylesheet" href="css/UHW01.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="gran_contenedor">
        
        <div class="zona_imagen">
            <img src="img/doctor2.jpg" alt="Doctor">
        </div>

        <div class="zona_formulario">
            
            <div class="cabecera">
                <a href="index.html" class="boton_flecha">
                    <i class="fa fa-arrow-left"></i> Atrás
                </a>
                <img src="img/logo.png" class="logo_pequeno" alt="Logo SIGCMI">
            </div>

            <div class="titulos">
                <h1><i class="fa fa-users"></i> Crear Nueva Cuenta</h1>
                <p class="gris">Completa el formulario para registrarte en SIGCMI</p>
            </div>

            <p class="negrita_label">Tipo de Usuario</p>
            <div class="botones_tipo">
                
                <a href="UHW02" class="enlace_caja">
                    <button class="opcion">
                        <i class="fa fa-user-md"></i>
                        <div class="texto_opcion">
                            <p class="negrita">Médico</p>
                            <p class="gris_chico">Registrarme como profesional</p>
                        </div>
                    </button>
                </a>

                <a href="UHW01.html" class="enlace_caja">
                    <button class="opcion activa">
                        <i class="fa fa-user"></i>
                        <div class="texto_opcion">
                            <p class="negrita">Paciente</p>
                            <p class="gris_chico">Registrarme para agendar citas</p>
                        </div>
                    </button>
                </a>
            </div>
            <h3 class="separador">Información Personal</h3>

            <div class="lista_campos">
                <div class="campo_basico">
                    <p>Nombre</p>
                    <input type="text" placeholder="Ingrese su nombre">
                </div>
                <div class="campo_basico">
                    <p>Apellido</p>
                    <input type="text" placeholder="Ingrese su apellido">
                </div>
                              <div class="campo_basico">
                    <p>Email</p>
                    <input type="email" placeholder="Ingrese su correo electrnico">
                </div>
                                <div class="campo_basico">
                    <p>Número de teléfono</p>
                    <input type="text" placeholder="Teléfono">
                </div>
                                <div class="campo_basico">
                    <p>Contraseña</p>
                    <input type="password">
                    <p class="info_puntos">Mínimo 8 - 12 Caracteres. Debe contener mayúscula y especial.</p>
                </div>
                         <div class="campo_basico">
                    <p>Confirmar contraseña</p>
                    <input type="password">
                </div>


           
        </div>
    </div>
</body>
</html>
