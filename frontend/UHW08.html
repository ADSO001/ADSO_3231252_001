<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recuperación de contraseña para el sistema SIGCMI.">
    <title>SIGCMI - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/UHW08.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <main class="gran_contenedor">

        <section class="zona_imagen" role="img" aria-label="Ilustración de un profesional de la salud">
            <img src="img/doctor2.jpg" alt="Doctor atendiendo consulta" loading="eager">
        </section>
         <section class="zona_formulario">

            <header class="cabecera_interna">
                <span class="marca_sigcmi">SIGCMI</span>
            </header>
                <div class="contenedor_login">

                <img src="img/logo.png" class="logo_centrado" alt="Logo corporativo SIGCMI">
                

                <div class="caja_recuperacion">
                    <div class="icono_llave" aria-hidden="true">
                        <i class="fa-solid fa-envelope-open-text"></i>
                    </div>
                 <h1 class="titulo_recuperar">¿Olvidaste tu contraseña?</h1>
                 <p class="instrucciones">Ingresa tu email y te enviaremos una nueva contraseña.</p>
                    <div class="grupo_input_recuperar">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="sigcmi@gmail.com" required>
                          <span class="info_auxiliar">Enviaremos una nueva contraseña a este correo.</span>

                    </div>
                    <button type="button" class="boton_enviar"  onclick="enviar(event)">
                        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                        <span>Enviar</span>
                    </button>
                                        <nav class="navegacion_retorno">
                        <a href="index.html" class="volver">
                            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Volver al inicio de sesión
                        </a>
                    </nav>
                </div>
            </div>
            
            <footer class="footer_logo">
                <img src="img/logo.png" alt="Logo pie de página SIGCMI">
            </footer>
        </section>
    </main>

    <script src="script/UHW08.js"></script>
</body>

</html>
