<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Doctor, en esta página encontrarás toda la información acerca de tus citas de hoy y pacientes.">
    <title>SIGCMI</title>
    <link rel="stylesheet" href="css/UHW13.css">
    <link href="https://fonts.googleapis.com/css2?family=Material Symbols Outlined" rel="stylesheet" />
</head>

<body>

    <header class="header">
        <img class="logo" src="img/logo.jpg" alt="Logotipo de SIGCMI">
        <div class="user" aria-live="polite"></div>
        <button id="logout">Cerrar sesión</button>
    </header>

    <main class="container">

        <section class="cajas">
            <div class="caja">
                <span class="material-symbols-outlined icono">calendar_month</span>
                <h3>Citas hoy</h3>
                <p class="number" id="citasHoy">0</p>
                <p class="def">Citas programadas</p>
            </div>

            <div class="caja">
                <span class="material-symbols-outlined icono">schedule</span>
                <h3>Próximas citas</h3>
                <p class="number" id="proxCita">0</p>
                <p class="def">Esta semana y siguientes</p>
            </div>

            <div class="caja">
                <span class="material-symbols-outlined icono">assignment</span>
                <h3>Consultas totales</h3>
                <p class="number" id="ConTotal">0</p>
                <p class="def">Registros creados</p>
            </div>
        </section>

        <section class="menu">

            <a href="UHW13.html" class="pag activo">
                <span class="material-symbols-outlined icono-menu">calendar_month</span>
                Agenda de hoy
            </a>

            <a href="UHW14.html" class="pag">
                <span class="material-symbols-outlined icono-menu">schedule</span>
                Próximas citas
            </a>

            <a href="UHW15.html" class="pag">
                <span class="material-symbols-outlined icono-menu">folder</span>
                Historial de citas
            </a>

        </section>

        <script src="js/UHW13.js"></script>
</body>

</html>
